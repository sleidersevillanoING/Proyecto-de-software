# Server
server.port=8080

# Spring Boot
spring.application.name=Sistema-Textil

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_textil?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Logging para ver las rutas mapeadas
logging.level.org.springframework.web=DEBUG
logging.level.com.proyectodesoftware=DEBUG